<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendador de Filmes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: #fff;
        }

        header {
            text-align: center;
            padding: 20px 0;
            background: #111;
            color: #f00;
            font-size: 32px;
            font-weight: bold;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 40px;
            position: relative;
        }

        .search-form {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 10px;
            position: relative;
        }

        .search-input {
            width: 400px;
            padding: 12px 15px;
            font-size: 16px;
            border-radius: 4px;
            border: 2px solid #f00;
            outline: none;
        }

        .search-input:focus {
            box-shadow: 0 0 8px #f00;
        }

        .search-button {
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            background: #f00;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
        }

        .search-button:hover {
            background: #cc0000;
        }

        /* Caixa de sugestões */
        .suggestions {
            position: absolute;
            top: 48px;
            left: 0;
            width: 400px;
            max-height: 250px;
            overflow-y: auto;
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            z-index: 10;
        }

        .suggestion-item {
            padding: 8px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .suggestion-item:hover {
            background: #222;
        }

        h2 {
            color: #f00;
            text-align: center;
            margin: 20px 0;
        }

        .movies {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 30px;
            margin-bottom: 40px;
        }

        .movie-card {
            text-align: center;
            width: 220px;
        }

        .movie-card img {
            width: 100%;
            border-radius: 6px;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }

        .movie-card p {
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <header>Recomendador de Filmes</header>

    <div class="container">
        <form action="/recommend" method="POST" class="search-form" autocomplete="off">
            <div style="position: relative;">
                <input
                    type="text"
                    id="movie-input"
                    name="movie"
                    class="search-input"
                    placeholder="Digite o nome de um filme"
                    required
                >
                <div id="suggestions" class="suggestions" style="display: none;"></div>
            </div>
            <button type="submit" class="search-button">Buscar recomendações</button>
        </form>

        {% if movie_name %}
            <h2>Recomendações para: {{ movie_name }}</h2>
            <div class="movies">
                {% for movie in recommendations %}
                    <div class="movie-card">
                        {% if movie.poster_path %}
                            <img src="https://image.tmdb.org/t/p/w300{{ movie.poster_path }}" alt="{{ movie.title }}">
                        {% endif %}
                        <p>{{ movie.title }}</p>
                    </div>
                {% endfor %}
            </div>
        {% endif %}
    </div>

    <script>
        const API_KEY = "03653c3faab388510f4c1ad642dd9b5f"; // sua chave TMDb aqui também
        const input = document.getElementById("movie-input");
        const suggestionsBox = document.getElementById("suggestions");

        let timeoutId = null;

        input.addEventListener("input", () => {
            const query = input.value.trim();

            // se tiver pouco texto, some com as sugestões
            if (query.length < 2) {
                suggestionsBox.style.display = "none";
                suggestionsBox.innerHTML = "";
                return;
            }

            // debounce: espera um pouquinho antes de buscar
            if (timeoutId) clearTimeout(timeoutId);
            timeoutId = setTimeout(() => {
                fetchSuggestions(query);
            }, 300);
        });

        // buscar sugestões na TMDb
        function fetchSuggestions(query) {
            const url = `https://api.themoviedb.org/3/search/movie?api_key=${API_KEY}&language=pt-BR&query=${encodeURIComponent(query)}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const results = data.results || [];
                    if (results.length === 0) {
                        suggestionsBox.style.display = "none";
                        suggestionsBox.innerHTML = "";
                        return;
                    }

                    suggestionsBox.innerHTML = "";
                    results.slice(0, 8).forEach(movie => {
                        const div = document.createElement("div");
                        div.className = "suggestion-item";
                        const year = movie.release_date ? ` (${movie.release_date.slice(0, 4)})` : "";
                        div.textContent = movie.title + year;

                        div.addEventListener("click", () => {
                            input.value = movie.title;
                            suggestionsBox.style.display = "none";
                            suggestionsBox.innerHTML = "";
                        });

                        suggestionsBox.appendChild(div);
                    });

                    suggestionsBox.style.display = "block";
                })
                .catch(err => {
                    console.error("Erro ao buscar sugestões:", err);
                    suggestionsBox.style.display = "none";
                    suggestionsBox.innerHTML = "";
                });
        }

        // esconder sugestões se clicar fora
        document.addEventListener("click", (e) => {
            if (!suggestionsBox.contains(e.target) && e.target !== input) {
                suggestionsBox.style.display = "none";
            }
        });
    </script>

</body>
</html>
